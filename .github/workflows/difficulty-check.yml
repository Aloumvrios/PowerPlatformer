# Simulates every stage x difficulty on PRs that could change difficulty,
# comments the numbers, and fails if a preset is off its target band (or a
# stage has no presets yet). Make "Difficulty check" a required status check
# on main to block merging in that case.
#
# It runs on every PR (skipping the simulation when nothing relevant
# changed) rather than using a `paths:` filter, because a required check
# whose workflow is filtered out never reports and would block unrelated PRs.
name: Difficulty check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: difficulty-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Difficulty check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did anything that affects difficulty change?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/(levels?[./]|game\.ts|tuning\.ts|types\.ts|input\.ts|difficulty-presets\.json|sim/)|scripts/sim\.mjs|docs/difficulty-baseline\.json|package(-lock)?\.json)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "Nothing that affects difficulty changed; skipping the simulation." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.relevant == 'true'
        with:
          node-version: 20
          cache: npm

      - if: steps.changes.outputs.relevant == 'true'
        run: npm ci

      - name: Simulate players
        id: sim
        if: steps.changes.outputs.relevant == 'true'
        continue-on-error: true
        run: npm run sim -- check --out sim-out/check.md

      - name: Job summary
        if: steps.changes.outputs.relevant == 'true'
        run: cat sim-out/check.md >> "$GITHUB_STEP_SUMMARY"

      # Updates one comment per PR rather than adding a new one each push.
      # (Fork PRs get a read-only token, so this step may fail there; the
      # job summary still has the numbers.)
      - name: Comment on the PR
        if: steps.changes.outputs.relevant == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const body = require("fs").readFileSync("sim-out/check.md", "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.user.type === "Bot" && c.body.includes("<!-- difficulty-check -->"));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Fail if any difficulty is off target
        if: steps.sim.outcome == 'failure'
        run: |
          echo "::error::A stage's difficulty is off target (or a stage isn't tuned yet). See the job summary."
          exit 1
