# "Run workflow" button (Actions → Difficulty tune): re-tunes the difficulty
# presets with the balancing simulator on the selected branch and opens a
# PR into that branch with the new presets, report and baseline.
#
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests".
#
# PRs opened with the built-in token don't trigger other workflows, so this
# job posts the "Difficulty check" status on its own commit itself (it has
# just run the same check as part of tuning).
name: Difficulty tune

on:
  workflow_dispatch:
    inputs:
      stages:
        description: "Stage ids to tune, comma-separated (blank = all stages)"
        required: false
        default: ""
      difficulties:
        description: "Difficulties to tune"
        required: false
        default: "easy,medium,hard"
      pace:
        description: "Bot pace (blank = keep the baseline's; >1 = slower players)"
        required: false
        default: ""
      iterations:
        description: "Search rounds per difficulty"
        required: false
        default: "10"

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tune
        id: tune
        continue-on-error: true
        env:
          STAGES: ${{ inputs.stages }}
          DIFFICULTIES: ${{ inputs.difficulties }}
          PACE: ${{ inputs.pace }}
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          args=(tune --iterations "$ITERATIONS")
          [ -n "$STAGES" ] && args+=(--stages "$STAGES")
          [ -n "$DIFFICULTIES" ] && args+=(--only "$DIFFICULTIES")
          [ -n "$PACE" ] && args+=(--pace "$PACE")
          npm run sim -- "${args[@]}"

      - name: Open a PR with the results
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.ref_name }}
          TUNE_OUTCOME: ${{ steps.tune.outcome }}
        run: |
          test -f sim-out/check.md || { echo "::error::Tuning didn't finish"; exit 1; }
          branch="difficulty-tune/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/difficulty-presets.json docs/difficulty-tuning.md docs/difficulty-baseline.json
          if git diff --cached --quiet; then
            echo "Tuning produced no changes." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git commit -m "Re-tune difficulty presets" -m "Generated by the Difficulty tune workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push origin "$branch"
          {
            echo "Re-tuned by the [Difficulty tune run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Full numbers: \`docs/difficulty-tuning.md\`."
            echo
            cat sim-out/check.md
          } > pr-body.md
          gh pr create --base "$BASE" --head "$branch" --title "Re-tune difficulty presets" --body-file pr-body.md
          state=$([ "$TUNE_OUTCOME" = "success" ] && echo success || echo failure)
          gh api "repos/${GITHUB_REPOSITORY}/statuses/$(git rev-parse HEAD)" \
            -f state="$state" -f context="Difficulty check" \
            -f description="Checked by the Difficulty tune workflow" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat sim-out/check.md >> "$GITHUB_STEP_SUMMARY"
